<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a5e"><title>Cooperaciones - Juquilita</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="juquilita.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script><script src="config.js"></script></head><body>
<header class="header"><h1>Cooperaciones</h1><p>Colonia Juquilita Sección 7</p></header><main class="container">
<div class="card"><div class="filter-row"><button class="btn btn-light" onclick="filtrar('todos')">👥 Todos</button><button class="btn btn-success" onclick="filtrar('pagados')">🟢 Pagados</button><button class="btn btn-warning" onclick="filtrar('parciales')">🟡 Parciales</button><button class="btn btn-danger" onclick="filtrar('pendientes')">🔴 Pendientes</button></div></div>
<div class="card"><label for="buscador">Buscar</label><input type="text" id="buscador" placeholder="🔍 Nombre o número de talón"><div class="actions" style="margin-top:10px"><button class="btn btn-success" onclick="exportarExcel()">📥 Excel/CSV</button><button class="btn btn-primary" onclick="exportarPDF()">📄 PDF</button></div></div>
<div id="lista"></div><div class="card"><h3 class="section-title">Totales</h3><div id="totales"></div></div>
<div class="card"><h3 class="section-title">Avance de la meta</h3><div class="progress"><div id="barraProgreso" class="progress-bar">0%</div></div></div>
<div class="card"><canvas id="grafica"></canvas></div></main><a href="index.html" class="home-float">🏠 Inicio</a>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
const app=initializeApp(window.JUQUILITA_FIREBASE_CONFIG),db=getFirestore(app);const lista=document.getElementById('lista'),meta=window.JUQUILITA_META;let datosGlobales=[],datosFiltradosActuales=[],chart;const formato=n=>(Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN'});const n=v=>Number(v)||0;
window.filtrar=tipo=>{let f=datosGlobales;if(tipo!=='todos')f=datosGlobales.filter(x=>{const t=n(x.efectivo)+n(x.deposito);return tipo==='pendientes'?t<5000:tipo==='parciales'?t>=5000&&t<=9900:t>=10000});render(f)};
onSnapshot(collection(db,'cooperaciones'),snap=>{datosGlobales=[];snap.forEach(s=>datosGlobales.push({id:s.id,...s.data()}));render(datosGlobales)},err=>{lista.innerHTML=`<div class="card notice">No fue posible leer los datos. Verifica la conexión o las reglas de lectura de Firebase.</div>`;console.error(err)});
function render(datos){datosFiltradosActuales=datos;lista.innerHTML='';let c=0,c170=0,c120=0,cx=0,e=0,d=0;datos.forEach(x=>{const ef=n(x.efectivo),dep=n(x.deposito),total=ef+dep,coop=n(x.cooperacion),a=n(x.cooperacion170),b=n(x.cooperacion120),z=n(x.cooperacionX);let estado=total>=10000?'🟢 Pagado':total>=5000?'🟡 Parcial':'🔴 Pendiente',color=total>=10000?'#219653':total>=5000?'#e6a700':'#d64545';const div=document.createElement('div');div.className='persona';div.style.borderLeft=`6px solid ${color}`;div.innerHTML=`<div class="persona-head"><div class="nombre">${esc(x.nombre||'Sin nombre')}</div><span class="badge" style="background:${color}">${estado}</span></div><div class="persona-grid"><div class="dato"><span>Cooperación</span><strong>${formato(coop)}</strong></div><div class="dato"><span>Cooperación $120.00</span><strong>${formato(b)}</strong></div><div class="dato"><span>Efectivo</span><strong>${formato(ef)}</strong></div><div class="dato"><span>Cooperación $170.00</span><strong>${formato(a)}</strong></div><div class="dato"><span>Depósito</span><strong>${formato(dep)}</strong></div><div class="dato"><span>${esc(window.COOPERACION_X_NOMBRE)}</span><strong>${formato(z)}</strong></div><div class="dato"><span>Número de talón</span><strong>${esc(x.numeroTalon||'—')}</strong></div><div class="dato total-dato"><span>Total Efectivo + Depósito</span><strong>${formato(total)}</strong></div></div>`;lista.appendChild(div);c+=coop;c170+=a;c120+=b;cx+=z;e+=ef;d+=dep});const total=e+d,faltante=Math.max(meta-total,0),porcentaje=meta?Math.min(total/meta*100,100):0;document.getElementById('totales').innerHTML=`Cooperación: <strong>${formato(c)}</strong><br>Cooperación $170: <strong>${formato(c170)}</strong><br>Cooperación $120: <strong>${formato(c120)}</strong><br>${esc(window.COOPERACION_X_NOMBRE)}: <strong>${formato(cx)}</strong><br>Efectivo: <strong>${formato(e)}</strong><br>Depósito: <strong>${formato(d)}</strong><hr>Total recaudado (Efectivo + Depósito): <strong>${formato(total)}</strong><br>Meta: <strong>${formato(meta)}</strong><br>Faltante: <strong>${formato(faltante)}</strong>`;const barra=document.getElementById('barraProgreso');barra.style.width=porcentaje.toFixed(2)+'%';barra.textContent=porcentaje.toFixed(2)+'%';if(chart)chart.destroy();chart=new Chart(document.getElementById('grafica'),{type:'bar',data:{labels:['Reunido','Faltante'],datasets:[{label:'Avance del proyecto',data:[total,faltante]}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('buscador').addEventListener('input',e=>{const t=e.target.value.toLowerCase();render(datosGlobales.filter(x=>(x.nombre||'').toLowerCase().includes(t)||String(x.numeroTalon||'').toLowerCase().includes(t)))});
window.exportarExcel=()=>{const cols=['Nombre','Cooperación','Cooperación $170','Cooperación $120',window.COOPERACION_X_NOMBRE,'Número de Talón','Efectivo','Depósito','Total E+D','Estado'];let csv='\ufeff'+cols.join(',')+'\n';datosFiltradosActuales.forEach(x=>{const total=n(x.efectivo)+n(x.deposito),est=total>=10000?'Pagado':total>=5000?'Parcial':'Pendiente';csv+=[x.nombre,n(x.cooperacion),n(x.cooperacion170),n(x.cooperacion120),n(x.cooperacionX),x.numeroTalon||'',n(x.efectivo),n(x.deposito),total,est].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')+'\n'});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cooperaciones.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
window.exportarPDF=()=>{const {jsPDF}=window.jspdf,doc=new jsPDF('l','mm','a4');doc.setFontSize(14);doc.text('Cooperaciones - Colonia Juquilita Sección 7',14,14);const body=datosFiltradosActuales.map((x,i)=>[i+1,x.nombre||'',formato(n(x.cooperacion)),formato(n(x.cooperacion170)),formato(n(x.cooperacion120)),formato(n(x.cooperacionX)),x.numeroTalon||'',formato(n(x.efectivo)),formato(n(x.deposito)),formato(n(x.efectivo)+n(x.deposito))]);doc.autoTable({startY:19,head:[['#','Nombre','Coop.','$170','$120',window.COOPERACION_X_NOMBRE,'Talón','Efectivo','Depósito','Total E+D']],body,styles:{fontSize:8},headStyles:{fillColor:[31,78,121]}});doc.save('cooperaciones.pdf')};
</script><script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script></body></html>
