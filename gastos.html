<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a5e"><title>Gastos - Juquilita</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="juquilita.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script></head><body><header class="header"><h1>Gastos / Egresos</h1><p>Consulta del documento de gastos</p></header><main class="pdf-wrap"><div id="visor-pdf"></div></main><a href="index.html" class="home-float">🏠 Inicio</a><script>const visor=document.getElementById('visor-pdf');pdfjsLib.getDocument('documento.pdf').promise.then(async pdf=>{for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),base=page.getViewport({scale:1}),target=Math.min(window.innerWidth-24,1000),scale=Math.max(1,target/base.width),viewport=page.getViewport({scale}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=viewport.width;canvas.height=viewport.height;visor.appendChild(canvas);await page.render({canvasContext:ctx,viewport}).promise}}).catch(err=>{visor.innerHTML='<div class="card notice">No fue posible cargar el documento PDF.</div>';console.error(err)});if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');</script></body></html>
